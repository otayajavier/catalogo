<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ficha técnica</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex;
         align-items: center; justify-content: center; color: #333; text-align: center; padding: 1rem; }
  a { color: inherit; }
</style>
</head>
<body>
<p id="msg">Abriendo la ficha…</p>

<script src="../js/config.js?v=5"></script>
<script>
// Esta ficha ya no vive en este sitio: ahora es la ficha compartida.
// Se conserva esta dirección (…/ficha/?id=P0001) para no romper links viejos.
(function () {
  var FICHA_BASE = "https://ficha.miraleads.pro/";
  var id = new URLSearchParams(window.location.search).get("id");
  var sheet = (typeof CONFIG !== "undefined" && CONFIG.SPREADSHEET_ID) || "";
  var destino = (id && sheet && sheet.indexOf("PENDIENTE") !== 0)
    ? FICHA_BASE + "?sheet=" + encodeURIComponent(sheet) + "&id=" + encodeURIComponent(id)
    : "../";
  document.getElementById("msg").innerHTML =
    'Abriendo la ficha… <a href="' + destino.replace(/"/g, "&quot;") + '">Si no abre, haz clic aquí</a>';
  window.location.replace(destino);
})();
</script>
</body>
</html>
