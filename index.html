<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inmuebles disponibles — Portafolio</title>
<meta name="description" content="Inventario de inmuebles disponibles en venta y arriendo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <h1>Inmuebles disponibles</h1>
    <p>Portafolio actualizado en vivo — venta y arriendo.</p>
  </div>
</header>

<div class="filters" id="filters">
  <div class="filters-bar">
    <button id="btn-toggle-filters" class="filters-toggle" type="button" aria-expanded="false" aria-controls="filters-panel">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/>
        <line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/>
        <line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="2" fill="currentColor" stroke="none"/>
      </svg>
      Filtros
      <span class="filters-badge" id="filters-badge" hidden></span>
    </button>
    <span class="filters-count" id="filters-count"></span>
  </div>

  <div class="filters-panel" id="filters-panel" hidden>
    <select id="f-tipo" aria-label="Tipo de inmueble"><option value="">Todos los tipos</option></select>
    <select id="f-barrio" aria-label="Barrio o zona"><option value="">Toda la ciudad</option></select>
    <select id="f-servicio" aria-label="Venta o arriendo">
      <option value="">Venta y arriendo</option>
      <option value="venta">Solo venta</option>
      <option value="arriendo">Solo arriendo</option>
    </select>

    <div class="filter-group">
      <span class="filter-group-label">Precio (millones)</span>
      <input type="number" id="f-precio-min" placeholder="Desde" min="0" inputmode="numeric" aria-label="Precio desde, en millones">
      <span class="filter-sep">–</span>
      <input type="number" id="f-precio-max" placeholder="Hasta" min="0" inputmode="numeric" aria-label="Precio hasta, en millones">
    </div>

    <div class="filter-group">
      <span class="filter-group-label">Piso</span>
      <input type="number" id="f-piso-min" placeholder="Desde" min="0" inputmode="numeric" aria-label="Piso desde">
      <span class="filter-sep">–</span>
      <input type="number" id="f-piso-max" placeholder="Hasta" min="0" inputmode="numeric" aria-label="Piso hasta">
    </div>

    <select id="f-sort" aria-label="Ordenar por">
      <option value="random">Orden aleatorio</option>
      <option value="precio_asc">Precio: menor a mayor</option>
      <option value="precio_desc">Precio: mayor a menor</option>
    </select>

    <button id="btn-reset" type="button" class="btn-outline">Resetear filtros</button>
    <button id="btn-copy" type="button" class="btn-outline">Copiar enlace</button>
  </div>
</div>

<main class="gallery-wrap">
  <div id="gallery" class="gallery"></div>
  <p class="empty-state" id="empty-state" hidden>
    No encontramos inmuebles con esos filtros. Prueba ampliando el rango o usa "Resetear filtros" para ver todo el inventario.
  </p>
  <p class="loading-state" id="loading-state">Cargando inventario…</p>
</main>

<footer class="foot">
  <span id="last-updated"></span>
</footer>

<a id="whatsapp-float" class="whatsapp-float" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp" hidden>
  <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true">
    <path d="M17.6 6.32A7.85 7.85 0 0 0 12.05 4a7.94 7.94 0 0 0-6.9 11.9L4 20l4.2-1.1a7.9 7.9 0 0 0 3.85 1h.01a7.94 7.94 0 0 0 5.54-13.58ZM12.06 18.4h-.01a6.6 6.6 0 0 1-3.36-.92l-.24-.14-2.5.65.67-2.43-.16-.25a6.6 6.6 0 0 1 10.2-8.24 6.55 6.55 0 0 1 1.94 4.67 6.62 6.62 0 0 1-6.54 6.66Zm3.62-4.94c-.2-.1-1.17-.58-1.35-.64-.18-.07-.32-.1-.45.1-.13.19-.51.64-.63.78-.11.13-.23.15-.43.05-.2-.1-.83-.31-1.58-.98a5.9 5.9 0 0 1-1.1-1.36c-.11-.2 0-.3.09-.4.09-.1.2-.24.3-.36.1-.12.13-.2.2-.33.07-.13.03-.25-.02-.35-.05-.1-.45-1.08-.62-1.48-.16-.39-.33-.34-.45-.34h-.38c-.13 0-.35.05-.53.25-.18.19-.7.68-.7 1.66s.72 1.93.82 2.06c.1.13 1.4 2.14 3.4 3 .47.2.85.32 1.14.42.48.15.91.13 1.26.08.38-.06 1.17-.48 1.34-.94.16-.46.16-.86.11-.94-.05-.08-.18-.13-.38-.23Z"/>
  </svg>
</a>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
