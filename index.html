<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inmuebles disponibles — Portafolio</title>
<meta name="description" content="Inventario de inmuebles disponibles en venta y arriendo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <h1>Inmuebles disponibles</h1>
    <p>Portafolio actualizado en vivo — venta y arriendo.</p>
  </div>
</header>

<div class="filters" id="filters">
  <div class="filters-inner">
    <select id="f-tipo"><option value="">Todos los tipos</option></select>
    <select id="f-barrio"><option value="">Toda la ciudad</option></select>
    <select id="f-servicio">
      <option value="">Venta y arriendo</option>
      <option value="venta">Solo venta</option>
      <option value="arriendo">Solo arriendo</option>
    </select>
    <select id="f-precio">
      <option value="">Cualquier precio</option>
      <option value="0-150000000">Hasta $150M</option>
      <option value="150000000-250000000">$150M – $250M</option>
      <option value="250000000-400000000">$250M – $400M</option>
      <option value="400000000-600000000">$400M – $600M</option>
      <option value="600000000-900000000">$600M – $900M</option>
      <option value="900000000-">Desde $900M</option>
    </select>
    <span class="filters-count" id="filters-count"></span>
  </div>
</div>

<main class="gallery-wrap">
  <div id="gallery" class="gallery"></div>
  <p class="empty-state" id="empty-state" hidden>
    No encontramos inmuebles con esos filtros. Prueba ampliando el rango de precio o cambiando la zona.
  </p>
  <p class="loading-state" id="loading-state">Cargando inventario…</p>
</main>

<footer class="foot">
  <span id="last-updated"></span>
</footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
